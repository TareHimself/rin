name = "silo-recipes"
git = "https://github.com/TareHimself/silo-recipes"
rev = "7134eaf79088c28ceb43751ec92f7e8a8883facf"

[package.webmdx]
git = "https://github.com/TareHimself/webmdx"
rev = "20a1ef8184191acb4091265c03ca74953ee5db32"

[package.rwin]
git = "https://github.com/TareHimself/rwin"
rev = "c53c25d20fcd458fdbcdd4b8c5081e5de3cf54be"
