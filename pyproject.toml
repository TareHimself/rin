[project]
name = "rin"
version = "0.0.0"
description = "Tooling for building Rin's native modules. Rin itself is a .NET solution (rin.sln)."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
native = [
    "silo",
]

[tool.uv]
package = false
default-groups = ["native"]

[tool.uv.sources]
silo = { git = "https://github.com/TareHimself/silo", rev = "5ba46999d8a5f7c554065a08d4d7967f5a499f26", subdirectory = "client" }
