# Which paths each CI test job depends on (read by dorny/paths-filter in ci.yml). On a pull request a job
# only does its work when one of its paths changed; pushes to main always run everything. Keep in step with
# the project references: a missing path silently skips a test that should run.

shared: &shared
  - '.github/**'
  - 'Directory.Build.*'
  - 'Directory.Packages.props'
  - 'global.json'
  - 'NuGet.Config'
  - 'rin.sln'
  - 'msbuild/**'
  - 'scripts/**'
  - 'pyproject.toml'
  - 'uv.lock'

core: &core
  - 'Engine/Rin.Core/**'
  - 'Engine/Rin.SourceGenerators/**'
  - 'Shade/Rin.Shade/**'
  - 'Shade/Rin.Shade.SourceGenerator/**'

world: &world
  - 'Engine/Rin.World/**'

core-tests:
  - *shared
  - *core
  - 'Engine/Rin.Core.Tests/**'

world-tests:
  - *shared
  - *core
  - *world
  - 'Engine/Rin.World.Tests/**'

source-generators-tests:
  - *shared
  - *core
  - 'Engine/Rin.SourceGenerators.Tests/**'

gltf-tests:
  - *shared
  - *core
  - *world
  - 'Engine/Rin.GLTF/**'
  - 'Engine/Rin.GLTF.Tests/**'
  - 'Engine/Rin.Graphics.Null/**'

audio-tests:
  - *shared
  - *core
  - 'Engine/Rin.Audio.Miniaudio/**'
  - 'Engine/Rin.Audio.Miniaudio.Tests/**'

vulkan-tests:
  - *shared
  - *core
  - 'Slang/Rin.Slang/**'
  - 'Engine/Rin.Graphics.Vulkan/**'
  - 'Engine/Rin.Graphics.Vulkan.Tests/**'
  - 'native/Fakes/**'

slang-tests:
  - *shared
  - 'Slang/Rin.Slang/**'
  - 'Slang/Rin.Slang.Tests/**'

slang-compiler-tests:
  - *shared
  - 'Slang/Rin.Slang/**'
  - 'Slang/Rin.Slang.Compiler/**'
  - 'Slang/Rin.Slang.Compiler.Tests/**'
  - 'native/Fakes/**'

shade-tests:
  - *shared
  - 'Shade/**'

# The real-Slang jobs: the CPU shader tests and compiling every engine shader.
real-slang:
  - *shared
  - *core
  - *world
  - 'Shade/**'
  - 'Slang/**'
  - 'native/Rin.Slang.Native/**'
