name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack native stub packages
        run: python scripts/pack_native_stubs.py .feed

      # RinShade.targets builds Rin.Shade.MSBuild on demand if it isn't already built, but
      # never restores it first - fine on a dev machine with stale obj/ lying around, fails
      # with NETSDK1004 on a genuinely clean checkout. Restoring the whole solution once
      # up front (cheap, already-restored projects are a no-op) avoids that entirely.
      - name: Restore
        run: dotnet restore rin.sln -p:RinShadeSkipCompile=true

      # Rin.GLTF.Tests and Rin.Slang.Compiler.Tests genuinely call into native code at test
      # runtime, so their fakes need to exist before any test step runs.
      - name: Publish native fakes
        run: python scripts/publish_native_fakes.py win-x64

      # Rin.Core/Rin.World compile real shaders at build time via RinShade.targets, which
      # calls the real native Slang compiler - unrelated to which tests run afterward, and
      # something the fake natives above can't satisfy (they only cover test-time calls,
      # not calls made from inside an MSBuild task). None of these tests load real shader
      # content, so skip real compilation entirely instead of building real Slang native.
      - name: Test Rin.Core.Tests
        run: dotnet test Engine/Rin.Core.Tests/Rin.Core.Tests.csproj -p:RinShadeSkipCompile=true --no-restore --nologo --logger "console;verbosity=normal"

      - name: Test Rin.World.Tests
        run: dotnet test Engine/Rin.World.Tests/Rin.World.Tests.csproj -p:RinShadeSkipCompile=true --no-restore --nologo --logger "console;verbosity=normal"

      - name: Test Rin.SourceGenerators.Tests
        run: dotnet test Engine/Rin.SourceGenerators.Tests/Rin.SourceGenerators.Tests.csproj -p:RinShadeSkipCompile=true --no-restore --nologo --logger "console;verbosity=normal"

      - name: Test Rin.Slang.Tests
        run: dotnet test Slang/Rin.Slang.Tests/Rin.Slang.Tests.csproj -p:RinShadeSkipCompile=true --no-restore --nologo --logger "console;verbosity=normal"

      - name: Test Rin.GLTF.Tests
        run: dotnet test Engine/Rin.GLTF.Tests/Rin.GLTF.Tests.csproj -p:RinShadeSkipCompile=true --no-restore --nologo --logger "console;verbosity=normal"

      - name: Test Rin.Slang.Compiler.Tests
        run: dotnet test Slang/Rin.Slang.Compiler.Tests/Rin.Slang.Compiler.Tests.csproj -p:RinShadeSkipCompile=true --no-restore --nologo --logger "console;verbosity=normal"

      - name: Test Rin.Shade.Tests
        run: dotnet test Shade/Rin.Shade.Tests/Rin.Shade.Tests.csproj --no-restore --nologo --logger "console;verbosity=normal"

  # Builds the real Rin.Slang.Native (a prebuilt Slang release plus a small C++ wrapper, nothing from
  # Slang's own source) and runs what the fake-native job above cannot: the transpiler's CPU tests
  # and a full build that compiles every shader through real Slang.
  native-slang:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack native stub packages
        run: python scripts/pack_native_stubs.py .feed

      - name: Restore cached Slang native build
        id: slang-native-cache
        uses: actions/cache@v4
        with:
          path: |
            native/Rin.Slang.Native/build-release
            ~/.conan2
          key: slang-native-${{ runner.os }}-${{ hashFiles('native/Rin.Slang.Native/CMakeLists.txt', 'native/Rin.Slang.Native/conanfile.py', 'native/Rin.Slang.Native/src/**', 'native/base_recipe.py') }}

      - name: Install Conan
        if: steps.slang-native-cache.outputs.cache-hit != 'true'
        run: |
          pip install conan
          conan profile detect --force

      - name: Build Rin.Slang.Native
        if: steps.slang-native-cache.outputs.cache-hit != 'true'
        working-directory: native/Rin.Slang.Native
        run: |
          conan install . --build=missing -s build_type=Release -s compiler.cppstd=20
          cmake --preset Rin-Release --fresh
          cmake --build --preset Rin-Release

      # Overwrites the placeholder Rin.Slang.Native package from the stub step (same id and version).
      - name: Pack the real Rin.Slang.Native into the feed
        working-directory: native/Rin.Slang.Native
        run: |
          python ../make_nuspec_cli.py --name Rin.Slang.Native --version 1.0.0 --author TareHimself --source build-release/Release --output specs/Release.nuspec
          dotnet pack project.csproj -p:NuspecFile=specs/Release.nuspec -p:NuspecBasePath=specs --output ../../.feed

      - name: Restore
        run: dotnet restore rin.sln -p:RinShadeSkipCompile=true

      - name: Test Rin.Shade.CpuTests
        run: dotnet test Shade/Rin.Shade.CpuTests/Rin.Shade.CpuTests.csproj --no-restore --nologo --logger "console;verbosity=normal"

      - name: Build Rin.World with real shader compilation
        run: dotnet build Engine/Rin.World/Rin.World.csproj -c Release --no-restore --nologo
